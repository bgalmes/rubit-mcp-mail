name: Promote to stable

# Manual promotion, mirroring auto-release.yml: computes the final,
# non-prerelease version for whatever is currently on main (main's branch
# config in pyproject.toml defaults to `prerelease = false`, so this drops the
# `-rc.N` suffix), and opens a PR rather than pushing directly, since main
# requires a pull request for every change.
#
# Merging that PR is what publishes the final release, via publish-release.yml.
# A human decides when to run this and when to merge; nothing here fires on its
# own, and nothing auto-merges.
#
# There is deliberately no "force the bump level" input. semantic-release
# already finalizes the current release candidate to its stable version - even
# with no commits at all since the rc tag, 1.0.0-rc.2 promotes to 1.0.0 - and
# every forced level produces something wrong instead (--patch would give
# 1.0.1, --major 2.0.0).
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-promote
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-semantic-release
        run: python -m pip install --upgrade pip "python-semantic-release>=10,<11"

      - name: Compute the final stable version
        id: version
        run: |
          semantic-release version --no-commit --no-tag --no-push --no-vcs-release

          # python-semantic-release stages these files (git add) even with
          # --no-commit, so the diff to check is against HEAD, not the index.
          if git diff --quiet HEAD -- pyproject.toml CHANGELOG.md; then
            echo "Nothing to promote - already stable."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open or update the promotion PR
        if: steps.version.outputs.changed == 'true'
        uses: ./.github/actions/open-release-pr
        with:
          branch: release/promote
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Automated promotion to stable - **merge this PR to publish the release**.

            Merging tags the merge commit as `v${{ steps.version.outputs.version }}` and
            publishes it as the final, non-prerelease GitHub release, then builds and
            attaches the Linux and Windows installers.

            Note: CI does not run on this PR - GitHub does not trigger workflows for
            events created by `GITHUB_TOKEN`. The diff only ever touches
            `pyproject.toml` and `CHANGELOG.md`.
