name: Promote to stable

# Manual promotion: cuts a final, non-prerelease version for whatever is
# currently on main - the same commits already published as the latest
# `-rc.N` prerelease by auto-release.yml, just without the suffix (e.g.
# 1.3.0-rc.2 -> 1.3.0). A human decides when a release is done cooking;
# nothing here runs automatically.
#
# main's branch config in pyproject.toml (`prerelease = false`) already
# makes a plain `semantic-release version` compute the next *stable*
# version from the commits since the last full release, ignoring any `-rc.N`
# tags in between - so no extra flags are needed here versus auto-release.yml.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-semantic-release
        run: python -m pip install --upgrade pip "python-semantic-release>=10,<11"

      - name: Cut and publish the final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version
