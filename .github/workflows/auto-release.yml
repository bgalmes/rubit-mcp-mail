name: Prepare release

# main requires a pull request for every change, so this can't push a version
# bump straight to it. Instead, every push to main computes the next semantic
# version from the Conventional Commits made since the last release and opens
# (or updates) a small PR carrying just the pyproject.toml version bump and the
# CHANGELOG.md update.
#
# Nothing here merges that PR. That is deliberate, and load-bearing: a PR merged
# by GITHUB_TOKEN fires no pull_request event, so publish-release.yml would
# never run. A human merge is a real event, and it is what actually publishes
# the prerelease - see the "Releasing" section of the README for the full flow.
#
# A push with nothing releasable (only chore:/docs:/etc. commits, or the
# release PR's own merge) is a no-op: no branch, PR, or commit is created.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-semantic-release
        run: python -m pip install --upgrade pip "python-semantic-release>=10,<11"

      # Writes the bumped version + changelog into the working tree without
      # committing/tagging/pushing/releasing - those happen once a human lands
      # the PR this opens below.
      - name: Compute the next prerelease version
        id: version
        run: |
          semantic-release version --as-prerelease --prerelease-token rc \
            --no-commit --no-tag --no-push --no-vcs-release

          # python-semantic-release stages these files (git add) even with
          # --no-commit, so the diff to check is against HEAD, not the index.
          if git diff --quiet HEAD -- pyproject.toml CHANGELOG.md; then
            echo "No releasable changes since the last release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.version.outputs.changed == 'true'
        uses: ./.github/actions/open-release-pr
        with:
          branch: release/next
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Automated prerelease prep - **merge this PR to publish the prerelease**.

            Merging tags the merge commit as `v${{ steps.version.outputs.version }}` and
            publishes it as a GitHub prerelease with the changelog section below it,
            then builds and attaches the Linux and Windows installers.

            This PR is rewritten from scratch on every push to `main`, so it always
            carries the version for everything merged so far. Nothing is published
            until you merge it.

            Note: CI does not run on this PR - GitHub does not trigger workflows for
            events created by `GITHUB_TOKEN`. The diff only ever touches
            `pyproject.toml` and `CHANGELOG.md`.
