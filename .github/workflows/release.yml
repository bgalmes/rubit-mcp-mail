name: Build installers

# Publishing a release attaches a ready-to-run installer for each platform to
# it. workflow_dispatch is here so the build - especially the Windows half -
# can be exercised without cutting a release first.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # also on Windows, so one set of steps covers both
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            ext: ""
            asset: rubit-mcp-mail-linux.tar.gz
          - os: windows-latest
            label: Windows
            ext: ".exe"
            asset: rubit-mcp-mail-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Gives PyInstaller the Tcl/Tk shared libraries to bundle on Linux.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      # The wizard is the whole point of the installer, so a Python that cannot
      # open a window must fail here rather than ship a binary that greets the
      # user with a fallback prompt.
      - name: Check tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Run tests
        run: python -m pytest -q

      # One shared onedir bundle for both executables - see the spec file's
      # own comment for why: two independent --onefile builds used to mean
      # the installer embedded a full second copy of the server binary's
      # runtime as a data blob. MERGE() gives them one shared copy instead.
      - name: Build the server and installer executables
        run: pyinstaller --clean packaging/rubit-mcp-mail.spec

      - name: Smoke-test the server executable
        run: "dist/rubit-mcp-mail/rubit-mcp-mail${{ matrix.ext }} --help"

      # A real MCP stdio handshake, not just --help: this is what would catch
      # a module wrongly excluded from the frozen build (see the spec's
      # comment on what turned out NOT to be safely excludable).
      - name: Smoke-test the stdio transport with a real MCP handshake
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | "dist/rubit-mcp-mail/rubit-mcp-mail${{ matrix.ext }}" serve | grep -q '"protocolVersion"'
        env:
          RUBIT_MCP_MAIL_NO_KEYRING: "1"

      - name: Archive the bundle
        run: |
          cd dist/rubit-mcp-mail
          if [ "${{ runner.os }}" = "Windows" ]; then
            zip -r "../../${{ matrix.asset }}" .
          else
            tar czf "../../${{ matrix.asset }}" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
