name: Publish release

# Fires when one of the bot-managed release PRs (opened by auto-release.yml or
# promote-release.yml) is merged by a human. That merge is the point where main
# actually carries the new version, and - because it was a human and not
# GITHUB_TOKEN that merged - it raises a real push event that can trigger this
# workflow.
#
# It listens for the push rather than for the PR closing so that the whole run,
# including the reusable workflows it calls, carries github.ref =
# refs/heads/main. A called workflow runs in its caller's event context, and
# deploy-website.yml's deploy job sits behind the `github-pages` environment,
# whose deployment branch policy is checked against that ref before the job
# starts. Under `pull_request: closed` the ref is refs/pull/N/merge, which is
# not a branch and so can never satisfy the policy - the website job failed with
# "not allowed to deploy to github-pages due to environment protection rules".
# `gh workflow run --ref main` would be the other way to get a clean ref, but
# GITHUB_TOKEN cannot trigger workflow_dispatch and this repo has no PAT.
#
# The gate is therefore the commit subject rather than the PR's head branch.
# Only the release bot's PRs carry a `chore(release):` subject - pyproject.toml
# excludes exactly that prefix from the changelog - and main takes no commits
# except through a PR.
#
# Branch protection only blocks direct pushes to the main *branch*, not tags, so
# this job tags the merge commit and publishes the GitHub release: a prerelease
# for a version carrying an -rc.N suffix, a final release otherwise.
#
# The version is read straight out of the merged pyproject.toml rather than
# recomputed. Recomputing would race: if another PR merged while the release PR
# was open, semantic-release would derive a newer version than the tree that is
# actually being tagged.
on:
  push:
    branches: [main]
  # Publishes an EXISTING tag to PyPI (and, if it is a final release, to the MCP
  # registry). Only the `pypi` and `mcp-registry` jobs run: the tag and the
  # GitHub release already exist, `publish` refuses to re-tag, and there is no
  # reason to rebuild installers or redeploy the site.
  #
  # Two uses. Backfilling a release that predates the `pypi` job - v1.0.0 shipped
  # before it existed, so it was never uploaded - and retrying a release whose
  # upload failed, which matters because none of the version-bumping commit types
  # are ones this repo produces routinely: a run of `chore:`/`docs:`/`ci:` merges
  # cuts no release at all, so there is otherwise no way to reach this job.
  #
  # The upload step deliberately stays in THIS file rather than moving to a
  # reusable workflow: the PyPI trusted publisher is bound to the workflow
  # filename `publish-release.yml`, so relocating it would break authentication.
  # NB the ref is a ref, not necessarily a tag. v1.0.0 was tagged before the
  # packaging metadata existed, so building that tree would upload a release with
  # no licence, no keywords and - fatally - no `mcp-name:` marker, which the MCP
  # registry needs to verify ownership. PyPI never lets a version be replaced, so
  # that would burn 1.0.0 permanently. Backfill from `main` instead, and let the
  # guard in the pypi job below enforce it.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build and publish from. Use main to backfill 1.0.0."
        type: string
        required: true
        default: main

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit that landed on main, whatever merge method was used.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # tomllib needs 3.11+, and pins `python` to a known interpreter rather
      # than whatever the runner image happens to ship.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version that was merged
        id: version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          # A release is a prerelease iff the version carries a suffix - which
          # is also what distinguishes a release/next run from a release/promote
          # one, so the branch name never has to be consulted.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Done before the tag is pushed: everything up to that point is a
      # no-op that can simply be re-run, everything after it is not.
      - name: Extract the release notes for that version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text()

          # Everything under this version's "## vX.Y.Z (date)" heading, up to the
          # next version heading. The lookahead matters: a plain \b after the
          # version would let "v1.0.0" also match the "## v1.0.0-rc.1" heading.
          pattern = rf"^## v{re.escape(version)}(?=[ \n])[^\n]*\n(.*?)(?=^## v|\Z)"
          match = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)

          if match and match.group(1).strip():
              notes = match.group(1).strip()
          else:
              print(f"::warning::No CHANGELOG.md section found for {version}")
              notes = f"See [CHANGELOG.md](CHANGELOG.md) for the changes in {version}."

          pathlib.Path("release-notes.md").write_text(notes + "\n")
          print(notes)
          PY

      - name: Tag the merge commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists on the remote - nothing to publish."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--title "$TAG" --notes-file release-notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$TAG" "${args[@]}"

  # Publishes the package to PyPI, which is both how Python users expect to
  # install this (`pip install rubit-mcp-mail`) and the strongest name-match
  # search result the project can have - a PyPI page is indexed far faster than
  # a new GitHub Pages site.
  #
  # Trusted Publishing, so no API token is stored in this repo: PyPI verifies an
  # OIDC claim that these files were built by this workflow, in this repository,
  # in the `pypi` environment. That is what `id-token: write` is for.
  #
  # ONE-TIME SETUP, without which this job fails: create the project on PyPI and
  # register a trusted publisher for owner `bgalmes`, repository
  # `rubit-mcp-mail`, workflow `publish-release.yml`, environment `pypi`.
  # Nothing else depends on this job except `mcp-registry`, so a failure here
  # leaves the GitHub release, the installers and the website deploy intact.
  #
  # Prereleases are uploaded too: PEP 440 normalises 1.0.0-rc.1 to 1.0.0rc1, and
  # `pip install` ignores prereleases unless asked for them with --pre.
  pypi:
    needs: publish
    # `needs: publish` alone would skip this whenever `publish` skips - which is
    # exactly the workflow_dispatch case. always() keeps the job reachable; the
    # result check still stops a failed `publish` on a push from uploading a tag
    # that was never created.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      - name: Choose the ref to build from
        id: ref
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="$DISPATCH_REF"
          else
            ref="$RELEASE_TAG"
          fi
          if [ -z "$ref" ]; then
            echo "::error::Nothing to publish - no ref resolved."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Read from the checked-out pyproject.toml rather than parsed out of a tag
      # name, for the same reason the `publish` job does it: the tree being built
      # is the authority on what version it is. It also means a dispatch against
      # a branch works, where there is no tag to parse.
      - name: Read the version being published
        id: target
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "ref=${{ steps.ref.outputs.ref }}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from ${{ steps.ref.outputs.ref }} (prerelease=$prerelease)"

      # A PyPI version can never be re-uploaded, so a package published without
      # this marker could never afterwards be listed in the MCP registry under
      # that version - the registry verifies ownership by finding it in the PyPI
      # description. Refusing to build is far cheaper than burning the number.
      - name: Assert the MCP registry marker is present
        run: |
          if ! grep -q "mcp-name: io.github.bgalmes/rubit-mcp-mail" README.md; then
            echo "::error::README.md carries no mcp-name marker - this ref predates it."
            exit 1
          fi

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Runs before the upload because PyPI will not let a version be replaced:
      # a broken long_description is permanent until the next release.
      - name: Check the built metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Only final releases are listed: the registry entry is what every client's
  # discovery UI shows, and an -rc.N there would be what people install.
  #
  # Gated on `pypi` because the registry verifies ownership by fetching the PyPI
  # package and looking for the `mcp-name:` marker in its README - the upload
  # has to exist before the check can pass.
  mcp-registry:
    # Reads the tag from `pypi` rather than `publish`, so a dispatched backfill
    # lists the server too instead of stopping at the upload.
    needs: pypi
    if: >-
      always()
      && needs.pypi.result == 'success'
      && needs.pypi.outputs.prerelease == 'false'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      ref: ${{ needs.pypi.outputs.ref }}

  # A release created with GITHUB_TOKEN does not fire the `release: published`
  # event, so the installer build has to be called directly rather than left to
  # trigger itself.
  installers:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/build-installers.yml
    with:
      ref: ${{ needs.publish.outputs.tag }}
      release_tag: ${{ needs.publish.outputs.tag }}

  # Rebuilds the website so its download button and changelog pick up the new
  # release. Called directly for the same GITHUB_TOKEN reason as the installer
  # build above, and gated on `installers` so the Releases API already reports
  # the attached assets - running it earlier would publish a changelog whose
  # newest version shows no downloads.
  #
  # This inherits github.ref from the run, so it only clears the `github-pages`
  # environment because this workflow triggers on push to main. See the header.
  website:
    needs: [publish, installers]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: main
