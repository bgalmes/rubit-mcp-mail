name: CI

# The website lives in website/ and is built and deployed by
# deploy-website.yml; running the Python matrix on a site-only change is pure
# waste.
#
# Markdown is deliberately NOT excluded. tests/test_providers.py reads
# README.md and asserts the Thunderbird client ID still appears in it, so a
# README-only PR that drops it has to be caught here - excluding *.md would let
# exactly that PR merge green and break main.
#
# Note the wrinkle documented in the README under "Why you merge the release PR
# yourself": a workflow filtered out by paths-ignore reports no status at all,
# so if `main` ever requires this check, a website-only PR needs the admin
# "Merge without waiting for requirements to be met" button - the same button
# the release PRs already need.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".gitattributes"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pyright
        run: pyright

      - name: Run tests
        run: pytest -q

  # The suite is only platform-sensitive in a handful of places (file modes,
  # desktop entries, PowerShell quoting, fixture line endings), but the
  # release build runs it on Windows before packaging the installer - so a
  # Windows-only failure used to surface at release time rather than on the
  # PR that caused it. Lint and pyright stay on Linux: they say the same thing
  # on either platform.
  windows:
    name: Windows tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
