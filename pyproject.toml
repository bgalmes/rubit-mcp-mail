[build-system]
requires = ["setuptools>=77"]  # 77+ understands PEP 639 `license` / `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "rubit-mcp-mail"
version = "1.0.0"
description = "Provider-agnostic, read-only MCP server for reading mail over IMAP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# These three blocks are what a PyPI visitor actually sees and what PyPI's own
# search indexes. Deliberately no "License :: OSI Approved :: ..." classifier:
# PEP 639 forbids pairing one with the SPDX `license` string above.
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "imap",
    "email",
    "claude",
    "anthropic",
    "read-only",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
]
dependencies = [
    "mcp>=2.0,<3",
    "IMAPClient>=3.1",
    "msal>=1.30",
    "pydantic>=2.7",
    "keyring>=25",
    "html2text>=2024.2.26",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.6", "python-semantic-release>=10,<11"]
# Only needed to build the downloadable installers (see .github/workflows/build-installers.yml).
# hooks-contrib carries the keyring hook: without it, keyring's backends are
# discovered through entry points that a frozen bundle does not have.
build = ["pyinstaller>=6", "pyinstaller-hooks-contrib>=2024.7"]

[project.urls]
Homepage = "https://bgalmes.github.io/rubit-mcp-mail/"
Documentation = "https://bgalmes.github.io/rubit-mcp-mail/docs"
Repository = "https://github.com/bgalmes/rubit-mcp-mail"
Issues = "https://github.com/bgalmes/rubit-mcp-mail/issues"
Changelog = "https://bgalmes.github.io/rubit-mcp-mail/changelog"

[project.scripts]
rubit-mcp-mail = "rubit_mcp_mail.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]

# See .github/workflows/auto-release.yml and promote-release.yml, and the
# "Releasing" section of the README, for how these get used. `allow_zero_version`
# keeps versions in the 0.x range until a deliberate 1.0.0 breaking change;
# without it every release would jump straight to 1.0.0.
#
# pyproject.toml is the only file stamped with the version. Deliberately no
# `version_variables` for src/rubit_mcp_mail/__init__.py: `__version__` there is
# read from the installed package metadata, and the only literal in the file is
# the "0.0.0-dev" fallback for source checkouts - which semantic-release would
# happily rewrite to the release version, making a dev checkout claim to be one.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version} [skip ci]"
major_on_zero = true
allow_zero_version = true
tag_format = "v{version}"

# Every merge to main prepares a `-rc.N` prerelease; promote-release.yml is what
# drops the suffix for a final release (see the README). Both pass the prerelease
# settings on the command line, so this block only has to describe the branch.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.remote]
type = "github"
