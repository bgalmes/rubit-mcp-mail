[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubit-mcp-mail"
version = "0.1.0"
description = "Provider-agnostic, read-only MCP server for reading mail over IMAP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "IMAPClient>=3.1",
    "msal>=1.30",
    "pydantic>=2.7",
    "keyring>=25",
    "html2text>=2024.2.26",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.6"]

[project.scripts]
rubit-mcp-mail = "rubit_mcp_mail.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
